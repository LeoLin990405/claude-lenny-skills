name: Feature Request
description: Suggest a new skill, template, or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement!

  - type: dropdown
    id: type
    attributes:
      label: Request Type
      options:
        - New Skill
        - New Template
        - New Playbook
        - Improvement to Existing Content
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like to see added or changed?
      placeholder: Describe your idea.
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: How would this help your PM workflow?

  - type: textarea
    id: references
    attributes:
      label: References
      description: Links to relevant Lenny's Podcast episodes, articles, or frameworks.
